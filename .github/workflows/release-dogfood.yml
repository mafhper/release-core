name: Release (dogfood)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: "Tag a publicar (ex.: v1.0.0)"

permissions:
  contents: write

concurrency:
  group: release-dogfood
  cancel-in-progress: false

jobs:
  release:
    uses: mafhper/release-core/.github/workflows/release.yml@v1.1.5
    with:
      matrix: '[{"os":"ubuntu-latest"}]'
      tag: ${{ inputs.tag }}