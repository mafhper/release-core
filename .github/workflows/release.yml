name: Release Core

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: false
        default: '[{"os":"ubuntu-latest"}]'
      config-file:
        type: string
        required: false
        default: '.github/release.config.json'
      tag:
        type: string
        required: false
        default: ''

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versions.outputs.tag }}
      release_version: ${{ steps.versions.outputs.release_version }}
      prev_tag: ${{ steps.versions.outputs.prev_tag }}
      is_prerelease: ${{ steps.versions.outputs.is_prerelease }}
      release_id: ${{ steps.release.outputs.release_id }}
      build_enabled: ${{ steps.report.outputs.build_enabled }}
      contract_digest: ${{ steps.contract.outputs.digest }}
    steps:
      - name: Checkout do projeto consumidor (histórico completo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Bootstrap das ferramentas do Release Core
        run: |
          mkdir -p "$RUNNER_TEMP/.release-tools"
          git init -q "$RUNNER_TEMP/.release-tools"
          git -C "$RUNNER_TEMP/.release-tools" remote add origin https://github.com/mafhper/release-core.git
          git -C "$RUNNER_TEMP/.release-tools" fetch -q --depth 1 origin "${{ github.action_ref || 'main' }}"
          git -C "$RUNNER_TEMP/.release-tools" checkout -q FETCH_HEAD

      - name: Resolver a tag alvo
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::A tag $tag não existe neste repositório."; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Exportar configuração do projeto
        run: node "$RUNNER_TEMP/.release-tools/scripts/release-config.mjs" "${{ inputs.config-file }}" --env >> "$GITHUB_ENV"

      - name: Registrar o contrato desta execução
        id: contract
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          TOOLS_DIR: ${{ runner.temp }}/.release-tools
        run: |
          digest="$(bash "$TOOLS_DIR/scripts/contract-digest.sh")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Validar coerência da configuração
        run: |
          if [ "$DESKTOP" = "true" ] && [ -z "$RUST_TOOLCHAIN" ]; then
            echo "::error::desktop é true, mas build.rust está vazio (Tauri exige Rust)."; exit 1
          fi
          if [ -n "$BUN_VERSION" ] && [ "$PKG_MANAGER" != "bun" ]; then
            echo "::error::build.bun informado, mas build.package_manager não é \"bun\"."; exit 1
          fi

      - name: Validar matrix
        env:
          MATRIX_INPUT: ${{ inputs.matrix }}
        run: |
          node -e 'const ok = JSON.parse(process.env.MATRIX_INPUT); if (!Array.isArray(ok) || ok.length === 0) throw new Error("matrix precisa ser um array não vazio"); for (const cell of ok) if (typeof cell !== "object" || !cell || typeof cell.os !== "string") throw new Error("cada célula da matrix precisa de um campo os (string)");'

      - name: Validar versão da tag contra as fontes canônicas
        run: |
          args=()
          while IFS= read -r -d '' d; do
            IFS='|' read -r fmt path field <<< "$d"
            args+=("$fmt" "$path" "$field")
          done < <(printf '%s' "$VERSIONS_FILES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);console.log(v.map(f=>[f.format,f.path,f.field].join("|")).join("\0"))})')
          node "$RUNNER_TEMP/.release-tools/scripts/check-release-version.mjs" "$TAG" package.json "${args[@]}"

      - name: Derivar versão e tag anterior
        id: versions
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          version="${tag#v}"; version="${version%%[-+]*}"
          prerelease_part="$(printf '%s' "${tag#v}" | sed -n -E 's/^[0-9]+\.[0-9]+\.[0-9]+-(.+)$/\1/p')"
          prev_tag="$(node "$RUNNER_TEMP/.release-tools/scripts/prev-tag.mjs" "$version")"
          {
            echo "tag=$tag"
            echo "release_version=$version"
            echo "is_prerelease=$([ -n "$prerelease_part" ] && echo true || echo false)"
            echo "prev_tag=$prev_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Resolver a arte de release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          TOOLS_DIR: ${{ runner.temp }}/.release-tools
          PROJECT_ROOT: ${{ github.workspace }}
        run: bash "${{ runner.temp }}/.release-tools/scripts/image-step.sh" resolve

      - name: Validar política da imagem de release
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          PROJECT_ROOT: ${{ github.workspace }}
          PREV_TAG: ${{ steps.versions.outputs.prev_tag }}
        run: |
          node "$RUNNER_TEMP/.release-tools/scripts/image-policy.mjs"

      - name: Criar ou recuperar o release (rascunho, idempotente)
        id: release
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          prerelease="${{ steps.versions.outputs.is_prerelease }}"
          prerelease_flag=""
          if [ "$prerelease" = "true" ]; then prerelease_flag="--prerelease"; fi
          release_id=""
          for attempt in 1 2 3 4 5; do
            release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" 2>/dev/null | head -n 1 || true)"
            if [ -z "$release_id" ]; then
              if gh release create "$tag" --repo "$REPO" --draft $prerelease_flag --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes "" >/dev/null 2>&1; then
                release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" 2>/dev/null | head -n 1 || true)"
              else
                echo "Falha ao criar o release (tentativa $attempt)."
              fi
            fi
            if [ -n "$release_id" ]; then break; fi
            if [ "$attempt" -lt 5 ]; then
              echo "Aguardando o release ficar disponível (tentativa $attempt)..."
              sleep 10
            fi
          done
          if [ -z "$release_id" ]; then
            echo "::error::Não foi possível criar ou recuperar o release da tag $tag."; exit 1
          fi
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "release criado/recuperado: id $release_id"

      - name: Relatar topologia do build
        id: report
        run: |
          if [ -n "$BUILD_COMMAND" ] || [ "$GATES" != "[]" ] || [ "$PRE_STEPS" != "[]" ] || [ "$DIST_HAS_ARTIFACTS" = "true" ] || [ "$DESKTOP" = "true" ]; then
            echo "build_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_enabled=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.build_enabled == 'true' }}
    runs-on: ${{ matrix.os }}
    # `matrix[].optional` marca a célula como tolerante a falha. É o que permite
    # republicar sem a plataforma instável, que é exatamente o que um job
    # separado e não-bloqueante fazia antes de o Core existir.
    continue-on-error: ${{ matrix.optional == true }}
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
      fail-fast: false
    steps:
      - name: Checkout do projeto consumidor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap das ferramentas do Release Core
        run: |
          mkdir -p "$RUNNER_TEMP/.release-tools"
          git init -q "$RUNNER_TEMP/.release-tools"
          git -C "$RUNNER_TEMP/.release-tools" remote add origin https://github.com/mafhper/release-core.git
          git -C "$RUNNER_TEMP/.release-tools" fetch -q --depth 1 origin "${{ github.action_ref || 'main' }}"
          git -C "$RUNNER_TEMP/.release-tools" checkout -q FETCH_HEAD

      - name: Exportar configuração do projeto
        run: node "$RUNNER_TEMP/.release-tools/scripts/release-config.mjs" "${{ inputs.config-file }}" --env >> "$GITHUB_ENV"

      - name: Conferir o contrato contra o prepare
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          TOOLS_DIR: ${{ runner.temp }}/.release-tools
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.contract_digest }}
        run: bash "${{ runner.temp }}/.release-tools/scripts/check-contract.sh" "$EXPECTED_DIGEST"

      - name: Instalar dependências de sistema
        if: env.APT_DEPS != '[]' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          printf '%s' "$APT_DEPS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);console.log(v.map(JSON.stringify).join(" "))})' | xargs sudo apt-get install -y

      - name: Preparar Node.js
        if: env.NODE_VERSION != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Preparar Bun
        if: env.BUN_VERSION != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Preparar toolchain Rust (desktop/Tauri)
        if: env.DESKTOP == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Instalar dependências do projeto
        if: env.PKG_MANAGER != ''
        working-directory: ${{ env.PROJECT_WORKDIR }}
        run: |
          case "$PKG_MANAGER" in
            bun) bun install --frozen-lockfile ;;
            npm) npm ci ;;
            *) echo "package manager não suportado para instalação de dependências: $PKG_MANAGER"; exit 1 ;;
          esac

      - name: Portões de qualidade
        if: env.GATES != '[]'
        working-directory: ${{ env.PROJECT_WORKDIR }}
        run: |
          printf '%s' "$GATES" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);process.stdout.write(v.join("\u0000") + "\0")})' | while IFS= read -r -d '' cmd; do
            echo "» $cmd"
            bash -eu -c "$cmd"
          done

      - name: Passos de preparação
        if: env.PRE_STEPS != '[]'
        working-directory: ${{ env.PROJECT_WORKDIR }}
        run: |
          printf '%s' "$PRE_STEPS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const v=JSON.parse(s);process.stdout.write(v.join("\u0000") + "\0")})' | while IFS= read -r -d '' cmd; do
            echo "» $cmd"
            bash -eu -c "$cmd"
          done

      - name: Compilar o aplicativo
        if: env.BUILD_COMMAND != ''
        working-directory: ${{ env.PROJECT_WORKDIR }}
        run: bash -eu -c "$BUILD_COMMAND"

      - name: Definir diretório de cache de ferramentas do bundler (Tauri)
        if: env.DESKTOP == 'true' && runner.os == 'Windows'
        run: |
          echo "TOOLS_CACHE_DIR=$LOCALAPPDATA/cache/tauri" >> "$GITHUB_ENV"

      - name: Restaurar cache de ferramentas do bundler (Tauri)
        id: cache-restore
        if: env.DESKTOP == 'true' && runner.os == 'Windows'
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ${{ env.TOOLS_CACHE_DIR }}
          key: tauri-tools-${{ runner.os }}-wix314-v1

      - name: Pré-aquecer ferramentas WiX do bundler (MSI)
        if: env.DESKTOP == 'true' && runner.os == 'Windows'
        env:
          WIX_URL: https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip
          WIX_SHA256: 6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31
        run: |
          set -euo pipefail
          wix="$TOOLS_CACHE_DIR/WixTools314"
          required=(candle.exe light.exe wix.dll WixUIExtension.dll)
          complete=1
          for f in "${required[@]}"; do
            if [ ! -f "$wix/$f" ]; then complete=0; break; fi
          done
          if [ "$complete" = "1" ]; then
            echo "Ferramentas WiX já disponíveis em $wix."
            exit 0
          fi
          mkdir -p "$wix"
          attempt=1
          until curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/wix.zip" "$WIX_URL" \
                && echo "$WIX_SHA256  $RUNNER_TEMP/wix.zip" | sha256sum -c - >/dev/null 2>&1; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Falha ao baixar/verificar o WiX após $attempt tentativas: $WIX_URL"
              exit 1
            fi
            echo "Download do WiX falhou (tentativa $attempt); nova tentativa em 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done
          if command -v unzip >/dev/null 2>&1; then
            unzip -qo "$RUNNER_TEMP/wix.zip" -d "$wix"
          else
            powershell -NoProfile -Command "Expand-Archive -LiteralPath '$RUNNER_TEMP/wix.zip' -DestinationPath '$wix' -Force"
          fi
          rm -f "$RUNNER_TEMP/wix.zip"
          for f in "${required[@]}"; do
            if [ ! -f "$wix/$f" ]; then
              echo "::error::Arquivo WiX ausente após a extração: $f"
              exit 1
            fi
          done
          echo "Ferramentas WiX pré-aquecidas em $wix."

      - name: Gravar cache de ferramentas do bundler (Tauri) logo após pré-aquecimento
        if: env.DESKTOP == 'true' && runner.os == 'Windows' && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@3edfce9056124e459a23f683a21433670d47daca # v6.1.0
        with:
          path: ${{ env.TOOLS_CACHE_DIR }}
          key: tauri-tools-${{ runner.os }}-wix314-v1

      - name: Compilar e publicar instaladores (Tauri)
        if: env.DESKTOP == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: ${{ env.DESKTOP_PROJECT_PATH }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseId: ${{ needs.prepare.outputs.release_id }}
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}
          args: ${{ matrix.args }}

      - name: Coletar e validar artefatos desta célula
        if: env.DIST_HAS_ARTIFACTS == 'true'
        env:
          ARTIFACT_CELL_OS: ${{ matrix.os }}
          ARTIFACT_OUT: ${{ runner.temp }}/collected.txt
        run: |
          node "$RUNNER_TEMP/.release-tools/scripts/collect-artifacts.mjs"
          files=()
          while IFS= read -r f; do [ -n "$f" ] && files+=("$f"); done < "$RUNNER_TEMP/collected.txt"
          if [ "${#files[@]}" -eq 0 ]; then
            exit 0
          fi
          attempt=1
          until gh release upload "$TAG" --repo "$REPO" --clobber "${files[@]}"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::Falha ao enviar artefatos após $attempt tentativas."; exit 1
            fi
            echo "Reenviando artefatos (tentativa $((attempt + 1)))..."
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "Artefatos publicados por esta célula: ${#files[@]}"

      - name: Conferir o que esta célula prometeu produzir
        if: ${{ matrix.expect != null && matrix.expect != '' }}
        env:
          MATRIX_EXPECT: ${{ matrix.expect }}
        run: |
          node "$RUNNER_TEMP/.release-tools/scripts/check-cell-expect.mjs"

  finalize:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Checkout do projeto consumidor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap das ferramentas do Release Core
        run: |
          mkdir -p "$RUNNER_TEMP/.release-tools"
          git init -q "$RUNNER_TEMP/.release-tools"
          git -C "$RUNNER_TEMP/.release-tools" remote add origin https://github.com/mafhper/release-core.git
          git -C "$RUNNER_TEMP/.release-tools" fetch -q --depth 1 origin "${{ github.action_ref || 'main' }}"
          git -C "$RUNNER_TEMP/.release-tools" checkout -q FETCH_HEAD

      - name: Exportar configuração do projeto
        run: node "$RUNNER_TEMP/.release-tools/scripts/release-config.mjs" "${{ inputs.config-file }}" --env >> "$GITHUB_ENV"

      - name: Conferir o contrato contra o prepare
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          TOOLS_DIR: ${{ runner.temp }}/.release-tools
          EXPECTED_DIGEST: ${{ needs.prepare.outputs.contract_digest }}
        run: bash "${{ runner.temp }}/.release-tools/scripts/check-contract.sh" "$EXPECTED_DIGEST"

      - name: Conferir a distribuição da release
        if: env.DIST_HAS_ARTIFACTS == 'true'
        run: |
          node "$RUNNER_TEMP/.release-tools/scripts/verify-artifacts.mjs"

      - name: Publicar a arte de release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIG_FILE: ${{ inputs.config-file }}
          TOOLS_DIR: ${{ runner.temp }}/.release-tools
          PROJECT_ROOT: ${{ github.workspace }}
        run: bash "${{ runner.temp }}/.release-tools/scripts/image-step.sh" publish

      - name: Montar o corpo do release
        run: bash "${{ runner.temp }}/.release-tools/scripts/release-body.sh" "$RUNNER_TEMP/release-body.md"

      - name: Publicar o release
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          prerelease="${{ needs.prepare.outputs.is_prerelease }}"
          payload="$RUNNER_TEMP/release-payload.json"
          node -e 'const fs=require("fs");const path=process.env.RUNNER_TEMP+"/release-body.md";const q={draft:false,name:process.env.RELEASE_TITLE+" "+process.env.TAG,body:fs.readFileSync(path,"utf8"),prerelease:process.argv[1]==="true"};fs.writeFileSync(process.argv[2],JSON.stringify(q));' "$prerelease" "$payload"
          release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" 2>/dev/null | head -n 1)"
          attempt=1
          until gh api -X PATCH "repos/$REPO/releases/$release_id" --input "$payload"; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Falha ao publicar o release após $attempt tentativas."; exit 1
            fi
            echo "Repetindo publicação (tentativa $((attempt + 1)))..."
            attempt=$((attempt + 1))
            sleep 5
            release_id="$(gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$tag\") | .id" 2>/dev/null | head -n 1)"
            if [ -z "$release_id" ]; then
              echo "::error::Release $tag não encontrado para publicação."; exit 1
            fi
          done
          echo "Release $tag publicado."

      - name: Atestar release publicado
        run: |
          gh release view "$TAG" --repo "$REPO" --json isDraft,name -q 'if .isDraft then error("release ainda em rascunho") else ("publicado: " + .name) end'